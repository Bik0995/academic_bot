name: Scrape et Publie

on:
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 minutes
  workflow_dispatch:         # lancement manuel possible

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restaurer la base depuis le cache
        uses: actions/cache@v4
        with:
          path: opportunities.db
          key: db-${{ runner.os }}-${{ hashFiles('run_scraper.py') }}
          restore-keys: db-${{ runner.os }}-

      - name: Run scraper
        run: python run_scraper.py